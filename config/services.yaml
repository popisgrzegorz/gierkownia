# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Czas zycia calego stanu pokoju. Po imprezie Redis sprzata sie sam,
    # wiec nie ma osobnego zadania czyszczacego.
    app.room_ttl: '%env(int:ROOM_TTL)%'
    # Katalog z plikami muzycznymi i katalog z opisami talii. Rozdzielone,
    # bo talie sa wersjonowane razem z kodem, a muzyka nigdy nie powinna byc.
    app.media_dir: '%env(resolve:MEDIA_DIR)%'
    # Zapisane turnieje: jeden maly plik JSON na sesje. Poza Redisem (ten wygasa)
    # i poza Postgresem (jeden zrzut to za malo na encje i migracje).
    app.tournament_dir: '%kernel.project_dir%/var/tournaments'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            int $roomTtl: '%app.room_ttl%'
            int $mercurePublicPort: '%env(int:MERCURE_PUBLIC_PORT)%'
            string $mediaDir: '%app.media_dir%'
            string $tournamentDir: '%app.tournament_dir%'
            string $adminPassword: '%env(ADMIN_PASSWORD)%'

    # Moduly gier wpinaja sie same: kazda usluga implementujaca GameInterface
    # dostaje tag i trafia do GameRegistry. Dodanie gry nie wymaga zmian tutaj.
    _instanceof:
        App\Core\Game\GameInterface:
            tags: ['app.game']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Core\Game\GameRegistry:
        arguments:
            $games: !tagged_iterator app.game

    # Predis zamiast phpredis - czysty PHP, zero rozszerzen do zbudowania przy
    # przenosinach na Proxmox. Atomowosc SET NX i INCRBY siedzi w Redisie,
    # nie w kliencie, wiec arbitraz buzzera jest identyczny.
    Predis\Client:
        arguments:
            $parameters: '%env(REDIS_URL)%'

    Predis\ClientInterface: '@Predis\Client'
