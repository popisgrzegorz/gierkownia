# nginx dla Gierkowni w LXC (Ubuntu 24.04, PHP 8.3-FPM).
# Hub Mercure stoi pod TYM SAMYM adresem co gra (/.well-known/mercure) -
# Subscription wyprowadza adres huba z biezacego zadania, a przegladarka nie
# musi laczyc sie z osobnym portem.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/gierkownia/public;
    client_max_body_size 72M;

    location /.well-known/mercure {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE to jedno wiszace polaczenie: przy domyslnym buforowaniu nginx
        # trzyma eventy u siebie i tablo aktualizuje sie skokami albo wcale.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / { try_files $uri /index.php$is_args$args; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ { return 404; }
}
